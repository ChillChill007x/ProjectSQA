services:
  sqa-runner:
    user: "${SQA_UID:-1000}:${SQA_GID:-1000}"
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: core
    image: project-sqa:core-v2
    init: true
    working_dir: /workspace
    volumes:
      - ../:/workspace
    environment:
      TZ: America/Los_Angeles
      SQA_WORK: /workspace/work
      SQA_TOOLS: /opt/sqa/lib
    stdin_open: true
    tty: true

  sqa-ai:
    profiles: [ai]
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: ai
    image: project-sqa:ai-v2
    init: true
    working_dir: /workspace
    volumes:
      - ../:/workspace
      - ai-home:/home/sqa
    environment:
      TZ: America/Los_Angeles
      SQA_WORK: /workspace/work
      SQA_TOOLS: /opt/sqa/lib
    stdin_open: true
    tty: true

volumes:
  ai-home:
